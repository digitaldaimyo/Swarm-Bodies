name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      # Server tests and the online e2e tests need Postgres (SPEC §9.4, §14).
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: swarm
          POSTGRES_PASSWORD: swarm
          POSTGRES_DB: swarm
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U swarm" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://swarm:swarm@localhost:5432/postgres
      E2E_DATABASE_URL: postgres://swarm:swarm@localhost:5432/swarm_e2e
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
      - name: Balance smoke batches
        run: |
          pnpm balance -- --games 200 --players normal,random
          # SPEC §12.4 CI gate: every strain pair within 30–70% over a 200-game system batch.
          pnpm balance -- --matrix --games 200 --map system --gate --jobs 4
      - run: pnpm exec playwright install --with-deps chromium webkit
      - name: Golden replays, client smoke, frame budget, online play (Chromium and WebKit)
        run: pnpm test:e2e
